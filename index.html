<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎂 Happy Birthday!</title>
  <meta name="description"
    content="An interactive E-Birthday Card — blow out the candles and explore a special photo gallery!" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap"
    rel="stylesheet" />

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ════════════ CAT MEME STICKERS BACKGROUND ════════════ -->
  <div class="cat-stickers-layer" id="cat-stickers-layer" aria-label="Cat stickers background">
    <div class="cat-sticker sticker-popcat" id="sticker-popcat" title="Pop Cat (Click or hover me!)"
      style="--rot: -10deg;">
      <img src="images/stickers/popcat_closed.png" alt="Pop Cat Meme" />
      <span class="sticker-tag">Pop! 🐱</span>
    </div>
    <div class="cat-sticker sticker-smudge" title="Smudge the Cat" style="--rot: 8deg;">
      <img src="images/stickers/smudge.png" alt="Smudge the Cat Meme" />
      <span class="sticker-tag">Smudge 🥗</span>
    </div>
    <div class="cat-sticker sticker-plotting" title="Plotting Cat (Muehehe)" style="--rot: 6deg;">
      <img src="images/stickers/plotting_cat.jpg" alt="Plotting Cat Meme" />
      <span class="sticker-tag">Plotting 😼</span>
    </div>
    <div class="cat-sticker sticker-grumpy" title="Grumpy Cat" style="--rot: -7deg;">
      <img src="images/stickers/grumpy.jpg" alt="Grumpy Cat Meme" />
      <span class="sticker-tag">Grumpy 😾</span>
    </div>
    <div class="cat-sticker sticker-punch" title="Punch Cat" style="--rot: -14deg;">
      <img src="images/stickers/punch_cat.jpg" alt="Punch Cat Meme" />
      <span class="sticker-tag">Punch! 🥊</span>
    </div>
    <div class="cat-sticker sticker-huh" title="Huh? Cat" style="--rot: 6deg;">
      <img src="images/stickers/huh.png" alt="Huh Cat Meme" />
      <span class="sticker-tag">Huh? 🤔</span>
    </div>
    <div class="cat-sticker sticker-nyan" title="Nyan Cat" style="--rot: 10deg;">
      <img src="images/stickers/nyan_cat.png" alt="Nyan Cat Meme" />
      <span class="sticker-tag">Nyan 🌈</span>
    </div>
    <div class="cat-sticker sticker-sad" title="Crying Cat" style="--rot: -5deg;">
      <img src="images/stickers/sad_cat.jpeg" alt="Crying Cat Meme" />
      <span class="sticker-tag">HBD! 😿</span>
    </div>
    <div class="cat-sticker sticker-laughing" title="Laughing Cat" style="--rot: -8deg;">
      <img src="images/stickers/laughing_cat.jpg" alt="Laughing Cat Meme" />
      <span class="sticker-tag">Hehe 😂</span>
    </div>
    <div class="cat-sticker sticker-side-eye" title="Side Eye Cat" style="--rot: 7deg;">
      <img src="images/stickers/side_eye.png" alt="Side Eye Cat Meme" />
      <span class="sticker-tag">Side-eye 👀</span>
    </div>
  </div>

  <!-- ════════════ WELCOME MODAL ════════════ -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-emoji">🎉</div>
      <h1 class="modal-title" id="modal-title">Happy Birthday!</h1>
      <img src="cat_meme.jpg" alt="Cat Meme"
        style="width: 100%; max-width: 280px; border-radius: 12px; border: 3px solid #222; margin-bottom: 1.5rem; box-shadow: 4px 4px 0px #222;" />
      <br>
      <button id="btn-start" class="btn-primary">
        <span class="btn-icon">🎤</span> Candles Blow kar !
      </button>
      <p class="modal-hint">
        <span class="hint-icon">💡</span>
      </p>
    </div>
  </div>

  <!-- ════════════ CAKE SCENE ════════════ -->
  <section id="cake-scene" class="cake-scene hidden">
    <p class="blow-instruction" id="blow-instruction">🌬️ Blow kar mic madhe!</p>

    <!-- Volume meter -->
    <div class="volume-meter">
      <div class="volume-bar" id="volume-bar"></div>
    </div>

    <div class="cake-wrapper">
      <!-- Candles -->
      <div class="candles-row" id="candles-row">
        <div class="candle">
          <div class="flame lit"></div>
          <div class="smoke-trail"></div>
        </div>
        <div class="candle">
          <div class="flame lit"></div>
          <div class="smoke-trail"></div>
        </div>
        <div class="candle">
          <div class="flame lit"></div>
          <div class="smoke-trail"></div>
        </div>
        <div class="candle">
          <div class="flame lit"></div>
          <div class="smoke-trail"></div>
        </div>
        <div class="candle">
          <div class="flame lit"></div>
          <div class="smoke-trail"></div>
        </div>
      </div>

      <!-- Cake layers -->
      <div class="cake">
        <div class="cake-top">
          <div class="drip drip-1"></div>
          <div class="drip drip-2"></div>
          <div class="drip drip-3"></div>
          <div class="drip drip-4"></div>
          <div class="drip drip-5"></div>
        </div>
        <div class="cake-middle"></div>
        <div class="cake-bottom"></div>
        <div class="cake-plate"></div>
      </div>
    </div>

    <!-- Feeding Animation -->
    <div id="feeding-animation" class="feeding-animation hidden">
      <div class="cake-slice-emoji" id="cake-slice-emoji">🍰</div>
      <div class="feed-text" id="feed-text">Ghe Khaa !</div>
    </div>

    <p class="footer-credit"
      style="margin-top: 3rem; font-family: var(--font-script); font-size: 1.8rem; color: var(--pink-deep); text-align: center; line-height: 1.4;">
      - Made by your brother from another mother ❤️</p>
  </section>

  <!-- Floating particles background -->
  <div class="particles" id="particles"></div>

  <script src="script.js"></script>
</body>

</html>
